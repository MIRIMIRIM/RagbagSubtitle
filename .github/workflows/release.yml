# Manually build an existing git tag, upload artifacts, and publish a GitHub Release.
#
#   git tag 0.2.0 && git push origin 0.2.0
#   Actions → Release → Run workflow → enter tag

name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing git tag to build and publish (e.g. 0.2.0)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag }}
  cancel-in-progress: false

env:
  BUILD_DIR: build/ci
  BUILD_CONFIG: Release
  VCPKG_ROOT: ${{ github.workspace }}/vcpkg
  VCPKG_TARGET_TRIPLET: x64-windows-static
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg-binary-cache

jobs:
  windows:
    name: Build & publish (Windows x64)
    runs-on: windows-latest
    timeout-minutes: 180

    steps:
      - name: Checkout tag
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}

      - name: Verify exact tag checkout
        shell: bash
        run: |
          set -euo pipefail
          echo "Requested tag: ${{ inputs.tag }}"
          echo "HEAD: $(git rev-parse HEAD)"
          git describe --tags --exact-match HEAD

      - name: Enable GitHub Actions cache for vcpkg
        uses: actions/github-script@v9
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Prepare vcpkg binary cache directory
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null

      - name: Cache vcpkg tool and downloads
        uses: actions/cache@v6
        with:
          path: |
            ${{ env.VCPKG_ROOT }}
            ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-${{ runner.os }}-${{ env.VCPKG_TARGET_TRIPLET }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ env.VCPKG_TARGET_TRIPLET }}-

      - name: Bootstrap vcpkg
        shell: pwsh
        run: |
          if (-not (Test-Path "$env:VCPKG_ROOT/vcpkg.exe")) {
            git clone --depth 1 https://github.com/microsoft/vcpkg.git "$env:VCPKG_ROOT"
            & "$env:VCPKG_ROOT/bootstrap-vcpkg.bat" -disableMetrics
          } else {
            Write-Host "Using cached vcpkg at $env:VCPKG_ROOT"
          }
          & "$env:VCPKG_ROOT/vcpkg.exe" version

      - name: Configure (CMake + vcpkg manifest)
        shell: pwsh
        run: |
          cmake -B $env:BUILD_DIR -S . `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET="$env:VCPKG_TARGET_TRIPLET" `
            -DCMAKE_BUILD_TYPE="$env:BUILD_CONFIG" `
            -DBUILD_TESTING=OFF `
            -DRAGBAG_BUILD_PROBE=OFF

      - name: Build
        shell: pwsh
        run: cmake --build $env:BUILD_DIR --config $env:BUILD_CONFIG --parallel

      - name: Locate plugin DLL
        id: locate
        shell: pwsh
        run: |
          $candidates = @(
            Join-Path $env:BUILD_DIR "$env:BUILD_CONFIG/ragbag-subtitle-ffmpeg.dll"
            Join-Path $env:BUILD_DIR "ragbag-subtitle-ffmpeg.dll"
          )
          $dll = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $dll) {
            Write-Error "ragbag-subtitle-ffmpeg.dll not found under $env:BUILD_DIR"
            Get-ChildItem -Recurse $env:BUILD_DIR -Filter "ragbag-subtitle-ffmpeg.*" | ForEach-Object { $_.FullName }
            exit 1
          }
          Write-Host "Plugin DLL: $dll"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "dll=$dll"

      - name: Package release assets
        shell: pwsh
        run: |
          $tag = "${{ inputs.tag }}"
          $repo = "${{ github.repository }}"
          $safeTag = $tag -replace '[\\/:*?"<>|]', '_'
          $stage = "dist/stage"
          $zipName = "ragbag-subtitle-ffmpeg-windows-x64-$safeTag.zip"
          $zipPath = "dist/$zipName"

          New-Item -ItemType Directory -Force -Path $stage, dist | Out-Null

          Copy-Item -Force "${{ steps.locate.outputs.dll }}" $stage
          Copy-Item -Force LICENSE, README.md, vcpkg.json $stage
          Copy-Item -Force include/ragbag/subtitle_plugin_api.h $stage

          $notice = @"
          RagbagSubtitle binary release ($tag)
          =====================================

          Contents
          --------
          - ragbag-subtitle-ffmpeg.dll
            Single Windows x64 plugin DLL. FFmpeg (libavcodec/libavutil) is
            statically linked via the vcpkg x64-windows-static triplet. Host
            applications should place this file under their executable-relative
            runtimes directory.
          - subtitle_plugin_api.h
            Public C plugin ABI header.
          - LICENSE
            GNU Lesser General Public License v2.1 (or later).
          - README.md, vcpkg.json
            Build and dependency notes for this tag.

          License / FFmpeg (LGPL)
          -----------------------
          This plugin and the statically linked FFmpeg components are
          distributed under LGPL-2.1-or-later. The combined DLL is an
          LGPL-covered work.

          Corresponding source for RagbagSubtitle is this repository at tag
          $tag. Corresponding source for FFmpeg is obtained by resolving the
          ffmpeg version pinned by the vcpkg port used when building this
          artifact (see the build log / vcpkg install tree for the exact
          version), or from https://ffmpeg.org/ and
          https://github.com/FFmpeg/FFmpeg.

          Written offer (LGPL section 6c): for at least three years after
          publication of this binary, the copyright holders will provide
          complete corresponding source for the LGPL-covered components in
          this package upon request, at no more than the cost of distribution.
          Contact the repository maintainers via GitHub Issues on
          https://github.com/$repo.
          "@
          $notice = ($notice -split "`n" | ForEach-Object { $_ -replace '^          ', '' }) -join "`n"
          Set-Content -Path "$stage/NOTICE.txt" -Value $notice -Encoding utf8

          if (Test-Path $zipPath) { Remove-Item -Force $zipPath }
          Compress-Archive -Path "$stage/*" -DestinationPath $zipPath -CompressionLevel Optimal

          Get-FileHash $zipPath -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $zipName" } |
            Set-Content -Path "dist/$zipName.sha256" -Encoding ascii

          Get-ChildItem dist | Format-Table Name, Length -AutoSize

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: ragbag-subtitle-ffmpeg-windows-x64-${{ inputs.tag }}
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag }}
          name: RagbagSubtitle ${{ inputs.tag }}
          # Tags like 0.2.0-dev / 1.0.0-rc1 are marked pre-release automatically.
          prerelease: ${{ contains(inputs.tag, '-') }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            Windows x64 build of the `ragbag-subtitle-ffmpeg` plugin for tag `${{ inputs.tag }}`.

            ### Assets
            - `ragbag-subtitle-ffmpeg-windows-x64-*.zip` — plugin DLL, ABI header, LICENSE, NOTICE
            - matching `.sha256` checksum

            ### Notes
            - FFmpeg (`libavcodec` / `libavutil`) is **statically linked** (`x64-windows-static`).
            - Place `ragbag-subtitle-ffmpeg.dll` under Aegisub's executable-relative `runtimes/` directory.
            - Licensed under **LGPL-2.1-or-later**; see `LICENSE` and `NOTICE.txt` inside the zip.
          files: |
            dist/*.zip
            dist/*.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
