name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing git tag to build and publish (e.g. v0.2.0)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag }}
  cancel-in-progress: false

env:
  BUILD_DIR: build/ci
  BUILD_CONFIG: Release
  VCPKG_ROOT: ${{ github.workspace }}/vcpkg
  VCPKG_TARGET_TRIPLET: x64-windows-static
  VCPKG_BINARY_CACHE_DIR: ${{ github.workspace }}/vcpkg-binary-cache
  VCPKG_COMMIT: 39344dff01c5a5a0134caf2624cdd492f05d30ea

jobs:
  windows:
    name: Build & publish (Windows x64)
    runs-on: windows-latest
    timeout-minutes: 180
    env:
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/vcpkg-binary-cache,readwrite
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg-binary-cache

    steps:
      - name: Checkout tag
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}

      - name: Verify exact tag checkout
        shell: bash
        run: |
          set -euo pipefail
          echo "Requested tag: ${{ inputs.tag }}"
          echo "HEAD: $(git rev-parse HEAD)"
          git describe --tags --exact-match HEAD

      - name: Prepare vcpkg binary cache directory
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path $env:VCPKG_BINARY_CACHE_DIR | Out-Null

      - name: Cache vcpkg binary packages
        uses: actions/cache@v6
        with:
          path: ${{ env.VCPKG_BINARY_CACHE_DIR }}
          key: vcpkg-bin-${{ runner.os }}-${{ env.VCPKG_TARGET_TRIPLET }}-${{ env.VCPKG_COMMIT }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-bin-${{ runner.os }}-${{ env.VCPKG_TARGET_TRIPLET }}-${{ env.VCPKG_COMMIT }}-
            vcpkg-bin-${{ runner.os }}-${{ env.VCPKG_TARGET_TRIPLET }}-
          save-always: true

      - name: Bootstrap vcpkg
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if (Test-Path $env:VCPKG_ROOT) {
            Remove-Item -Recurse -Force $env:VCPKG_ROOT
          }
          New-Item -ItemType Directory -Force -Path $env:VCPKG_ROOT | Out-Null
          git -C $env:VCPKG_ROOT init
          git -C $env:VCPKG_ROOT remote add origin https://github.com/microsoft/vcpkg.git
          git -C $env:VCPKG_ROOT fetch --depth 1 origin $env:VCPKG_COMMIT
          git -C $env:VCPKG_ROOT checkout FETCH_HEAD
          & "$env:VCPKG_ROOT/bootstrap-vcpkg.bat" -disableMetrics
          & "$env:VCPKG_ROOT/vcpkg.exe" version
          Write-Host "VCPKG_BINARY_SOURCES=$env:VCPKG_BINARY_SOURCES"

      - name: Configure (CMake + vcpkg manifest)
        shell: pwsh
        run: |
          cmake -B $env:BUILD_DIR -S . `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET="$env:VCPKG_TARGET_TRIPLET" `
            -DCMAKE_BUILD_TYPE="$env:BUILD_CONFIG" `
            -DBUILD_TESTING=OFF `
            -DRAGBAG_BUILD_PROBE=OFF

      - name: Build
        shell: pwsh
        run: cmake --build $env:BUILD_DIR --config $env:BUILD_CONFIG --parallel

      - name: Locate plugin DLL
        id: locate
        shell: pwsh
        run: |
          $candidates = @(
            Join-Path $env:BUILD_DIR "$env:BUILD_CONFIG/ragbag-subtitle-ffmpeg.dll"
            Join-Path $env:BUILD_DIR "ragbag-subtitle-ffmpeg.dll"
          )
          $dll = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $dll) {
            Write-Error "ragbag-subtitle-ffmpeg.dll not found under $env:BUILD_DIR"
            Get-ChildItem -Recurse $env:BUILD_DIR -Filter "ragbag-subtitle-ffmpeg.*" | ForEach-Object { $_.FullName }
            exit 1
          }
          Write-Host "Plugin DLL: $dll"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "dll=$dll"

      - name: Package release assets
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $tag = "${{ inputs.tag }}"
          $safeTag = $tag -replace '[\\/:*?"<>|]', '_'
          $stage = "dist/stage"
          $zipName = "ragbag-subtitle-ffmpeg-windows-x64-$safeTag.zip"
          $zipPath = "dist/$zipName"

          New-Item -ItemType Directory -Force -Path $stage, dist | Out-Null

          Copy-Item -Force "${{ steps.locate.outputs.dll }}" $stage
          Copy-Item -Force include/ragbag/subtitle_plugin_api.h $stage
          # Older tags (e.g. v0.2.0) may not contain LICENSE; keep packaging resilient.
          if (Test-Path "LICENSE") {
            Copy-Item -Force "LICENSE" $stage
          } else {
            Write-Warning "LICENSE not present in this tag checkout; packaging without it."
          }

          if (Test-Path $zipPath) { Remove-Item -Force $zipPath }
          Compress-Archive -Path "$stage/*" -DestinationPath $zipPath -CompressionLevel Optimal

          Get-FileHash $zipPath -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $zipName" } |
            Set-Content -Path "dist/$zipName.sha256" -Encoding ascii

          Get-ChildItem dist | Format-Table Name, Length -AutoSize
          Get-ChildItem $stage | Format-Table Name, Length -AutoSize

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: ragbag-subtitle-ffmpeg-windows-x64-${{ inputs.tag }}
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag }}
          name: RagbagSubtitle ${{ inputs.tag }}
          prerelease: ${{ contains(inputs.tag, '-') }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/*.zip
            dist/*.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
